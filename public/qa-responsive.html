<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Sperin responsive QA</title><style>body{background:#ddd;color:#111;font:14px system-ui;margin:12px}nav{display:flex;gap:8px;padding-bottom:12px;align-items:center}button,select{padding:8px}iframe{border:0;height:810px;background:#111;display:block;margin:auto}#results{white-space:pre-wrap;font:12px monospace}</style><nav><label>Viewport <select id="width"><option>375</option><option>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Route <select id="route"><option>/</option><option>/services/rewires</option><option>/services/consumer-units</option><option>/services/testing</option><option>/services/ev-chargers</option><option>/services/smart-home</option><option>/services/kitchens-bathrooms</option><option>/commercial</option><option>/our-work</option><option>/reviews</option><option>/leave-a-review</option><option>/about</option><option>/contact</option><option>/faqs</option><option>/privacy</option><option>/gallery</option><option>/our-work/missing-project</option><option>/missing-page</option></select></label><button id="check">Check layout</button></nav><iframe id="site" title="Website under test" src="/" width="375"></iframe><pre id="results"></pre><script>const site=document.querySelector('#site');document.querySelector('#width').onchange=e=>site.style.width=e.target.value+'px';document.querySelector('#route').onchange=e=>site.src=e.target.value;document.querySelector('#check').onclick=()=>{const d=site.contentDocument;document.querySelector('#results').textContent=JSON.stringify({route:site.contentWindow.location.pathname,viewport:site.clientWidth,scrollWidth:d.documentElement.scrollWidth,h1:d.querySelector('h1')?.textContent,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),canonical:d.querySelector('link[rel=canonical]')?.href},null,2)};</script></html>
