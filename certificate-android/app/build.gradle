plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.co.sperinservices.certificates'
    compileSdk 35
    // Android instruments the custom preview build type, not debug or release.
    testBuildType 'preview'

    signingConfigs {
        stable {
            storeFile file(System.getProperty("user.home") + "/.android/sperin-certificates-stable.jks")
            storePassword "android"
            keyAlias "sperincertificates"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId 'uk.co.sperinservices.certificates.stable'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 197
        versionName '1.9.4-dev'
        manifestPlaceholders = [appLabel: 'Sperin Certificates']
    }

    buildTypes {
        preview {
            initWith release
            applicationIdSuffix '.preview.team.v194'
            signingConfig signingConfigs.debug
            debuggable false
            manifestPlaceholders = [appLabel: 'Sperin Certificates 1.9.4']
        }
        debug {
            debuggable true
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
