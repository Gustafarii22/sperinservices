name: Build Sperin Certificates APK

on:
  push:
    branches:
      - main
    paths:
      - "public/certificates/**"
      - "certificate-android/**"
      - ".github/workflows/certificate-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sperin-certificates-debug-keystore-v1

      - name: Bundle certificate web app
        run: |
          rm -rf certificate-android/app/src/main/assets/certificates
          mkdir -p certificate-android/app/src/main/assets/certificates
          cp public/certificates/index.html certificate-android/app/src/main/assets/certificates/
          cp public/certificates/styles.css certificate-android/app/src/main/assets/certificates/
          cp public/certificates/app.js certificate-android/app/src/main/assets/certificates/
          cp public/certificates/manifest.webmanifest certificate-android/app/src/main/assets/certificates/
          cp public/certificates/icon.svg certificate-android/app/src/main/assets/certificates/

      - name: Build APK
        run: gradle -p certificate-android :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p certificate-android/dist
          cp certificate-android/app/build/outputs/apk/debug/app-debug.apk certificate-android/dist/Sperin-Certificates-v1.2.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sperin-Certificates-v1.2.1
          path: certificate-android/dist/Sperin-Certificates-v1.2.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="certificates-v1.2.1"
          APK="certificate-android/dist/Sperin-Certificates-v1.2.1.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Sperin Certificates v1.2.1" --notes "Voice questionnaire Android build. Installs alongside the legacy v1.1 APK so existing data can be backed up and restored safely."
          fi
