name: Build Sperin Certificates APK

on:
  push:
    branches:
      - main
    paths:
      - "public/certificates/**"
      - "certificate-android/**"
      - ".github/workflows/certificate-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sperin-certificates-apk-signing
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Certificate release regression guard
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fail = (ok, msg) => { if (!ok) { console.error('::error::' + msg); process.exit(1); } };
          const app = fs.readFileSync('public/certificates/app.js', 'utf8');
          const iet = fs.readFileSync('public/certificates/iet-forms.js', 'utf8');
          const gradle = fs.readFileSync('certificate-android/app/build.gradle', 'utf8');
          const java = fs.readFileSync('certificate-android/app/src/main/java/uk/co/sperinservices/certificates/MainActivity.java', 'utf8');
          const e2e = fs.readFileSync('certificate-android/qa/certificate.e2e.mjs', 'utf8');
          fail(app.includes("const VERSION = '1.7.8'"), 'Certificate UI version is not v1.7.8');
          fail(gradle.includes('versionCode 178') && gradle.includes("versionName '1.7.8'"), 'Android version is not v1.7.8 / 178');
          fail(java.includes('certificates-app-v178'), 'Bundled certificate origin route missing');
          fail(java.includes('shouldInterceptRequest'), 'Bundled certificate request interception missing');
          fail(java.includes('WebResourceResponse'), 'Bundled certificate WebResourceResponse missing');
          fail(iet.includes('function pdfText'), 'PDF glyph-safety normalizer missing');
          fail(iet.includes('MARK ONE BOX WITH X'), 'Worksheet X-mark instruction missing');
          fail(iet.includes('SPERIN SHEET'), 'Machine-readable worksheet identifier missing');
          fail(!iet.includes("cols.map(c=>c[0]+' '+c[1])"), 'Circuit schedule numbering has returned');
          fail(!iet.includes("tcols.map(c=>c[0]+' '+c[1])"), 'Test schedule numbering has returned');
          fail(!iet.includes('Outcome ✓ / N/A'), 'Unsupported check glyph remains in PDF heading');
          fail(iet.includes("orientation:cert.type==='eic'?'landscape':'portrait'"), 'EIC first page is not landscape');
          fail(iet.includes('Client address'), 'Client address PDF mapping missing');
          fail(iet.includes('Wiring / containment'), 'Circuit containment PDF mapping missing');
          fail(iet.includes('normaliseBoardRef'), 'Circuit board-reference normalisation missing');
          fail(iet.includes("return 'N/A'"), 'Inspection N/A rendering missing');
          console.log('CERTIFICATE_RELEASE_REGRESSION_GUARD_PASS');
          NODE

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore permanent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/sperin-certificates-stable.jks
          key: sperin-certificates-signing-key-v1

      - name: Create signing key on first run only
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/sperin-certificates-stable.jks" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/sperin-certificates-stable.jks"               -storepass android               -keypass android               -alias sperincertificates               -keyalg RSA               -keysize 3072               -validity 10000               -dname "CN=Sperin Services Certificates, OU=Sperin Services, O=Sperin Services, L=Birmingham, C=GB"
          fi
          test -f "$HOME/.android/sperin-certificates-stable.jks"
          keytool -list -v             -keystore "$HOME/.android/sperin-certificates-stable.jks"             -storepass android             -alias sperincertificates | grep "SHA256:" | head -1

      - name: Verify permanent signing fingerprint
        run: |
          EXPECTED="68:D9:F4:92:6E:DC:07:65:71:83:DE:10:03:9C:11:03:29:D8:94:D3:C6:87:4F:53:14:DF:CC:7C:D1:6B:F5:73"
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/sperin-certificates-stable.jks" -storepass android -alias sperincertificates | awk '/SHA256:/{print $2; exit}')"
          echo "Expected signer: $EXPECTED"
          echo "Actual signer:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Certificate signing key changed. Refusing to publish an incompatible APK."
            exit 1
          fi

      - name: Bundle certificate web app
        run: |
          rm -rf certificate-android/app/src/main/assets/certificates
          mkdir -p certificate-android/app/src/main/assets/certificates
          cp public/certificates/index.html certificate-android/app/src/main/assets/certificates/
          cp public/certificates/styles.css certificate-android/app/src/main/assets/certificates/
          cp public/certificates/app.js certificate-android/app/src/main/assets/certificates/
          cp public/certificates/iet-forms.js certificate-android/app/src/main/assets/certificates/
          cp public/certificates/manifest.webmanifest certificate-android/app/src/main/assets/certificates/
          cp public/certificates/icon.svg certificate-android/app/src/main/assets/certificates/
          mkdir -p certificate-android/app/src/main/assets/certificates/vendor
          cp public/certificates/vendor/jspdf.umd.min.js certificate-android/app/src/main/assets/certificates/vendor/
          cp public/certificates/vendor/jspdf.plugin.autotable.min.js certificate-android/app/src/main/assets/certificates/vendor/

      - name: Build APK
        run: gradle -p certificate-android :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p certificate-android/dist
          cp certificate-android/app/build/outputs/apk/debug/app-debug.apk certificate-android/dist/Sperin-Certificates-v1.7.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sperin-Certificates-v1.7.8
          path: certificate-android/dist/Sperin-Certificates-v1.7.8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="certificates-v1.7.8"
          APK="certificate-android/dist/Sperin-Certificates-v1.7.8.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Sperin Certificates v1.7.8" --notes "Bundled-runtime release: includes all v1.7.7 field workflow fixes and serves the packaged certificate UI on the sperinservices.co.uk WebView origin, preserving existing certificate localStorage while avoiding stale Vercel deployments."
          fi
