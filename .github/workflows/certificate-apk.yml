name: Verify permanent Sperin Certificates release candidate
on:
  push:
    branches: [fix/certificates-v197-data-safe-ux, fix/certificates-a4-true-size-print-20261106]
    paths:
      - '.github/workflows/certificate-apk.yml'
      - 'public/certificates/**'
      - 'certificate-android/qa/certificate.e2e.mjs'
      - 'certificate-android/qa/inspect-apk.py'
      - 'certificate-android/app/src/main/**'
      - 'certificate-android/app/src/androidTest/**'
      - 'certificate-android/app/build.gradle'
      - 'tests/certificates-immersive-pages.e2e.mjs'
      - 'tests/certificates-v196-view.e2e.mjs'
      - 'tests/certificates-v197-restore-routing.e2e.mjs'
      - 'tests/certificates-eicr-a4-structure.test.mjs'
  workflow_dispatch:
    inputs:
      first_version_code:
        description: 'Unused version code (upgrade proof uses this + 1)'
        required: true
        default: '212'
permissions:
  contents: read
concurrency:
  group: sperin-permanent-release
  cancel-in-progress: true
jobs:
  regression:
    uses: ./.github/workflows/certificate-e2e.yml
  candidate:
    needs: regression
    environment: certificates-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPERIN_KEYSTORE_PATH: ${{ github.workspace }}/../sperin-production.jks
      SPERIN_STORE_PASSWORD: ${{ secrets.SPERIN_STORE_PASSWORD }}
      SPERIN_KEY_PASSWORD: ${{ secrets.SPERIN_KEY_PASSWORD }}
      SPERIN_KEY_ALIAS: ${{ secrets.SPERIN_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install required SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Require retained key and separately verified backup
        env:
          JKS: ${{ secrets.SPERIN_PERMANENT_JKS_BASE64 }}
          BACKUP_VERIFIED_SHA256: ${{ secrets.SPERIN_BACKUP_VERIFIED_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test -s certificate-android/signing/permanent.sha256
          test -n "$JKS" && test -n "$SPERIN_STORE_PASSWORD" && test -n "$SPERIN_KEY_PASSWORD" && test -n "$SPERIN_KEY_ALIAS"
          test "$(cat certificate-android/signing/permanent.sha256)" = "$BACKUP_VERIFIED_SHA256"
          printf '%s' "$JKS" | base64 --decode > "$SPERIN_KEYSTORE_PATH"
          gradle -p certificate-android :app:verifyPermanentSigner --no-daemon
      - name: Bundle exact source and build first permanent candidate
        env:
          FIRST: ${{ inputs.first_version_code || '212' }}
        run: |
          set -euo pipefail
          [[ "$FIRST" =~ ^[0-9]+$ ]] && test "$FIRST" -gt 200
          mkdir -p certificate-android/app/src/main/assets/certificates certificate-android/dist
          cp -a public/certificates/. certificate-android/app/src/main/assets/certificates/
          gradle -p certificate-android :app:assemblePermanent -PreleaseVersionCode="$FIRST" --no-daemon
          cp certificate-android/app/build/outputs/apk/permanent/app-permanent.apk certificate-android/dist/first.apk
      - name: Restore retained key again and build a later version
        env:
          FIRST: ${{ inputs.first_version_code || '212' }}
          JKS: ${{ secrets.SPERIN_PERMANENT_JKS_BASE64 }}
        run: |
          set -euo pipefail
          rm "$SPERIN_KEYSTORE_PATH"
          umask 077
          printf '%s' "$JKS" | base64 --decode > "$SPERIN_KEYSTORE_PATH"
          gradle -p certificate-android clean :app:assemblePermanent :app:assemblePermanentAndroidTest -PtestVariant=permanent -PreleaseVersionCode="$((FIRST+1))" --no-daemon
          cp certificate-android/app/build/outputs/apk/permanent/app-permanent.apk certificate-android/dist/update.apk
          for apk in certificate-android/dist/first.apk certificate-android/dist/update.apk; do
            python3 certificate-android/qa/inspect-apk.py "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$apk.signer.txt"
            grep -Fi "$(cat certificate-android/signing/permanent.sha256)" "$apk.signer.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$apk.package.txt"
            grep -F "name='uk.co.sperinservices.certificates.stable.permanent'" "$apk.package.txt"
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, seed, upgrade without uninstall, and reopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash certificate-android/qa/permanent-upgrade.sh
      - name: Candidate checksum
        run: sha256sum certificate-android/dist/*.apk > certificate-android/dist/SHA256SUMS.txt
      - name: Retain verified candidates (not automatic production publication)
        uses: actions/upload-artifact@v4
        with:
          name: Sperin-permanent-verified-candidates
          path: certificate-android/dist/
          if-no-files-found: error
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$SPERIN_KEYSTORE_PATH"

  # Future builds: distribute verified APKs from GitHub Releases rather than
  # temporary chat/library attachments. Keep the release gated by the complete
  # certificate E2E suite, retained signer, install/upgrade/reopen and PDF Open.
  publish_verified_apk:
    needs: candidate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/certificates-v197-data-safe-ux' }}
    environment: certificates-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download only the fully tested and signed APK from this build
        uses: actions/download-artifact@v4
        with:
          name: Sperin-permanent-verified-candidates
          path: release-artifact
      - name: Gate publication on certificate identity, all upgrade tests and checksum
        id: verify
        run: |
          set -euo pipefail
          cd release-artifact
          test -s update.apk && test -s SHA256SUMS.txt
          expected="$(awk '$2 ~ /update.apk$/ {print $1}' SHA256SUMS.txt)"
          test "${#expected}" -eq 64
          echo "$expected  update.apk" | sha256sum -c -
          test "$(stat -c %s update.apk)" -gt 35000000
          grep -Fi '200881370fa891c1747063d117476567a571835b9fdf5c69c590f26386c205b1' update.apk.signer.txt
          grep -F "name='uk.co.sperinservices.certificates.stable.permanent'" update.apk.package.txt
          for report in upgrade-seed upgrade-check upgrade-reopened orientation-pdf-check pdf-open-check; do
            grep -F 'OK (1 test)' "$report.txt"
          done
          code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\\1/p" update.apk.package.txt | head -1)"
          [[ "$code" =~ ^[0-9]+$ ]]
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if (( code <= 213 )); then
            echo 'v213 already has a separately verified GitHub release; skip duplicate'
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish permanent GitHub release asset only after complete verification
        if: steps.verify.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.verify.outputs.code }}
        run: |
          set -euo pipefail
          cd release-artifact
          TAG="certificates-v${CODE}-verified"
          ASSET="Sperin-Certificates-v${CODE}-Verified.apk"
          cp update.apk "$ASSET"
          sha256sum "$ASSET" > release-SHA256SUMS.txt
          if gh release view "$TAG" -R Gustafarii22/sperinservices >/dev/null 2>&1; then
            echo "::error::A release tag already exists; refusing to overwrite an APK"
            exit 1
          fi
          cat > release-notes.txt <<EOF
          Permanently signed Sperin Certificates v${CODE}. Download the attached APK
          directly from GitHub instead of using a temporary ChatGPT Library file.
          Verification: build ${GITHUB_RUN_ID}, complete regression, Android signing
          key, in-place upgrade, certificate preservation, PDF Open/navigation.
          Package: uk.co.sperinservices.certificates.stable.permanent.
          Install over the current permanent version; do not uninstall the
          existing app or clear its saved certificates.
          EOF
          gh release create "$TAG" "$ASSET" release-SHA256SUMS.txt \\
            -R Gustafarii22/sperinservices --target "$GITHUB_SHA" \\
            --title "Sperin Certificates v${CODE} — Signed & Verified APK" \\
            --prerelease --notes-file release-notes.txt
          gh release view "$TAG" -R Gustafarii22/sperinservices --json assets \\
            --jq '.assets[] | [.name,.size,.digest,.url] | @tsv'
