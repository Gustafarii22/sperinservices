name: Format overhaul source

on:
  push:
    branches:
      - feat/iphone-simple-site-overhaul
    paths-ignore:
      - ".github/workflows/format-overhaul.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/iphone-simple-site-overhaul
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format changed source
        shell: bash
        run: |
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.json' '*.yml' '*.yaml')
          printf '%s\n' "${files[@]}"
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi
          npx prettier --write public/certificates/loader.js src/routes/leave-a-review.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format iPhone-style site overhaul"
          git push origin HEAD:feat/iphone-simple-site-overhaul
