name: Sperin Services QA

on:
  push:
    branches:
      - main
      - feature/real-work-reviews-ai-quote
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Review, pricing and security tests
        run: node --test tests/review-api.test.mjs tests/independent-reviews.test.mjs tests/google-business-reviews.test.mjs tests/pricing.test.mjs

      - name: Production build
        run: npm run build
