name: Sperin Certificates Daily Due Notices

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: read

concurrency:
  group: sperin-certificates-due-notices
  cancel-in-progress: false

jobs:
  due-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require separately configured scheduler credential
        env:
          CRON_TOKEN: ${{ secrets.SPERIN_CERT_REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::Set the same SPERIN_CERT_REMINDER_CRON_SECRET in GitHub Actions secrets and Vercel runtime."
            exit 1
          fi
      - name: Trigger due date notices idempotently
        env:
          CRON_TOKEN: ${{ secrets.SPERIN_CERT_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --connect-timeout 10 --max-time 100 \
            -X POST "https://sperinservices.co.uk/api/certificates/reminders/run" \
            -H "Authorization: Bearer $CRON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'
