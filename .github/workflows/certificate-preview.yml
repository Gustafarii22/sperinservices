name: Build emulator-only certificate QA APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle and compile QA only
        run: |
          mkdir -p certificate-android/app/src/main/assets/certificates
          cp -a public/certificates/. certificate-android/app/src/main/assets/certificates/
          gradle -p certificate-android :app:assemblePreview --no-daemon
          python3 certificate-android/qa/inspect-apk.py certificate-android/app/build/outputs/apk/preview/app-preview.apk
      # Disposable debug signatures are allowed only for CI/emulator QA.
      # No release publication or user-download artifact is produced here.
