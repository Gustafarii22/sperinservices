name: A4 EICR centred border, footer and Section K QA
on:
  push:
    branches:
      - fix/certificates-a4-true-size-print-20261106
    paths:
      - 'public/certificates/iet-forms.js'
      - 'public/certificates/app.js'
      - 'tests/certificates-eicr-a4-structure.test.mjs'
      - 'certificate-android/qa/verify-eicr-a4-layout.py'
      - '.github/workflows/certificate-a4-section-k-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-eicr-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and IET structure / no data mutation
        run: |
          node --check public/certificates/iet-forms.js
          node --check public/certificates/app.js
          node --test tests/certificates-eicr-a4-structure.test.mjs
          node --test tests/certificates-pdf-regions.test.mjs
      - name: Verify true physical A4 margins and clearance
        run: |
          python3 -m pip install --user pymupdf==1.26.5
          python3 certificate-android/qa/verify-eicr-a4-layout.py certificate-android/qa-output/eicr-a4-model-qa.pdf
      - name: Publish visual review PDF only
        uses: actions/upload-artifact@v4
        with:
          name: eicr-a4-section-k-layout-review
          path: certificate-android/qa-output/eicr-a4-model-qa.pdf
          if-no-files-found: error
