name: Final source formatting

on:
  push:
    branches:
      - feat/iphone-simple-site-overhaul

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/iphone-simple-site-overhaul

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format remaining source
        run: npx prettier --write src/lib/estimate-pdf.ts src/routes/__root.tsx eslint.config.js

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/estimate-pdf.ts src/routes/__root.tsx eslint.config.js
          git commit -m "Format remaining website source"
          git push origin HEAD:feat/iphone-simple-site-overhaul
