name: Certificate App E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/certificates/**"
      - "certificate-android/qa/**"
      - ".github/workflows/certificate-e2e.yml"

jobs:
  certificate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: sperin-certificates-playwright-1.56.1-chromium

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Start certificate server
        run: |
          python3 -m http.server 4173 -d public > /tmp/certificate-http.log 2>&1 &
          echo $! > /tmp/certificate-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/certificates/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/certificate-http.log
          exit 1

      - name: Run certificate E2E
        run: node certificate-android/qa/certificate.e2e.mjs
