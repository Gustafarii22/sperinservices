name: Certificate App E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/certificates/**"
      - "certificate-android/qa/**"
      - ".github/workflows/certificate-e2e.yml"
  push:
    branches: [main, release/sperin-certificates-v187-scanner-reviewed, feature/certificates-multiuser-specialist-forms-20261021]
    paths:
      - "public/certificates/**"
      - "certificate-android/qa/**"
      - ".github/workflows/certificate-e2e.yml"

jobs:
  certificate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: sperin-certificates-playwright-1.56.1-chromium

      - name: Install Playwright and PDF inspection tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Start certificate server
        run: |
          python3 -m http.server 4173 -d public > /tmp/certificate-http.log 2>&1 &
          echo $! > /tmp/certificate-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/certificates/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/certificate-http.log
          exit 1

      - name: Verify new independent cloud and import script syntax
        run: |
          node --check public/certificates/team-workspace.js
          node --check public/certificates/ai-assistance.js
          node --check public/certificates/instrument-import.js
          node --check public/certificates/app.js
          node --check public/certificates/iet-forms.js

      - name: Specialist PAT, EV, PV and fire certificate PDF and consent QA
        run: |
          node tests/certificates-commercial.e2e.mjs
          for t in pat ev solar commercialFire; do
            pdftotext -layout "/tmp/sperin-specialist-${t}.pdf" "/tmp/sperin-specialist-${t}.txt"
            grep -F "Specialist QA ${t}" "/tmp/sperin-specialist-${t}.txt"
          done

      - name: Photo scan safety and API tests
        run: node --test certificate-android/qa/scan-core.test.mjs certificate-android/qa/scan-row-isolation.test.mjs tests/certificate-scan.test.mjs tests/independent-reviews.test.mjs tests/iet-a4-model-form-audit.mjs

      - name: Photo review workflow (mock analysis, not recognition accuracy)
        run: node certificate-android/qa/scan.e2e.mjs

      - name: Prove scanned values and spare ways survive into the generated PDF
        run: |
          set -euo pipefail
          pdftotext -layout certificate-android/qa-output/scan-confirmed.pdf certificate-android/qa-output/scan-confirmed.txt
          pdftotext -layout certificate-android/qa-output/scan-with-spares.pdf certificate-android/qa-output/scan-with-spares.txt
          grep -F "Confirmed lights" certificate-android/qa-output/scan-confirmed.txt
          grep -E "^ *0 +MAIN SWITCH" certificate-android/qa-output/scan-confirmed.txt
          grep -E "^ *1 +SPD" certificate-android/qa-output/scan-confirmed.txt
          # The issuing schedule contains IET A4 data, not manufacturer/model/way-count extras.
          grep -F "Distribution circuit OCPD" certificate-android/qa-output/scan-confirmed.txt
          grep -F "BS EN 60947-2" certificate-android/qa-output/scan-confirmed.txt
          grep -F "BS EN 61008-1" certificate-android/qa-output/scan-confirmed.txt
          grep -F "CONT-100" certificate-android/qa-output/scan-confirmed.txt
          if grep -E 'Manufacturer:|Model:|Ways:|Populated:|Spare:' certificate-android/qa-output/scan-confirmed.txt; then
            echo "Non-IET board metadata leaked onto issued schedule"
            exit 1
          fi
          grep -E "^ *13 +SPARE" certificate-android/qa-output/scan-with-spares.txt
          grep -E "^ *14 +SPARE" certificate-android/qa-output/scan-with-spares.txt
          # Unfilled Constructor must stay empty — never stringify inherited Object.prototype.constructor.
          if grep -F 'function Object()' certificate-android/qa-output/scan-confirmed.txt certificate-android/qa-output/scan-with-spares.txt; then
            echo 'Inherited constructor function leaked into an issued EIC PDF'
            exit 1
          fi

      - name: Prove Minor Works IET A4 circuit details and issued certificate
        run: |
          node certificate-android/qa/minor-iet-a4.e2e.mjs
          PDF="certificate-android/qa-output/minor-iet-a4.pdf"
          pdftotext -layout "$PDF" certificate-android/qa-output/minor-iet-a4.txt
          for value in "SECTION A:" "SECTION B:" "SECTION C:" "SECTION D:" "SECTION E:" \
            "Minor Works Client QA" "Minor Works Electrician QA" \
            "BS EN 61009-1" "BS EN 62606" "ELECTRICIAN QA SIGNED"; do
            grep -F "$value" certificate-android/qa-output/minor-iet-a4.txt
          done
          if grep -E "Device manufacturer|Device model|Device kind" certificate-android/qa-output/minor-iet-a4.txt; then exit 1; fi
          pdftoppm -f 1 -l 1 -png -scale-to 1350 "$PDF" certificate-android/qa-output/minor-a4

      - name: Board workflow regressions
        run: |
          node certificate-android/qa/workflow.e2e.mjs
          CERT_WORKFLOW_TYPE=eicr node certificate-android/qa/workflow.e2e.mjs

      - name: Verify every EICR signatory field is printed
        run: |
          set -euo pipefail
          PDF="certificate-android/qa-output/workflow-eicr.pdf"
          test -s "$PDF"
          pdftotext -layout "$PDF" certificate-android/qa-output/workflow-eicr.txt
          for value in "EICR Inspector QA" "EICR Authoriser QA" \
            "Inspector signed" "Authoriser signed" \
            "Inspection Company QA" "Authorisation Company QA" \
            "Electrical Inspector" "Authorised Person" \
            "1 Inspection Street" "2 Authorisation Street"; do
            grep -F "$value" certificate-android/qa-output/workflow-eicr.txt
          done
          pdfinfo "$PDF" | grep -E '^Pages:'
          python3 certificate-android/qa/verify-eicr-footer.py "$PDF"
          mkdir -p certificate-android/qa-output/eicr-renders
          pdftoppm -f 1 -l 2 -png -r 130 "$PDF" certificate-android/qa-output/eicr-renders/eicr

      - name: Audit pass 1 — forward order
        env:
          CERT_AUDIT_PASS: forward
        run: node certificate-android/qa/certificate.e2e.mjs

      - name: Audit pass 2 — reverse order
        env:
          CERT_AUDIT_PASS: reverse
        run: node certificate-android/qa/certificate.e2e.mjs

      - name: Audit pass 3 — mixed order
        env:
          CERT_AUDIT_PASS: mixed
        run: node certificate-android/qa/certificate.e2e.mjs

      - name: Validate generated EIC PDF
        run: |
          set -euo pipefail
          PDF="certificate-android/qa-output/eic-regression.pdf"
          test -s "$PDF"
          pdftotext -layout "$PDF" certificate-android/qa-output/eic-regression.txt
          grep -F "Long Client Address House" certificate-android/qa-output/eic-regression.txt
          grep -F "LONG DESCRIPTION END" certificate-android/qa-output/eic-regression.txt
          grep -F "EXTENT END" certificate-android/qa-output/eic-regression.txt
          grep -F "LONG INSTALLATION ADDRESS END" certificate-android/qa-output/eic-regression.txt
          grep -F "Augustine Sperin" certificate-android/qa-output/eic-regression.txt
          grep -F "MFT-X1" certificate-android/qa-output/eic-regression.txt
          grep -F "ABC123" certificate-android/qa-output/eic-regression.txt
          # The issued Schedule of Circuit Details records the prescribed wiring code.
          # Containment descriptions remain internal, not appended to IET field 3.
          grep -E 'Circuit description|Type of wiring' certificate-android/qa-output/eic-regression.txt
          if grep -F "A / Surface" certificate-android/qa-output/eic-regression.txt; then
            echo "Non-IET containment detail leaked into Type of wiring"
            exit 1
          fi
          grep -F "Lighting test row" certificate-android/qa-output/eic-regression.txt
          grep -F "Sockets test row" certificate-android/qa-output/eic-regression.txt
          grep -E "^ *0 +Lighting" certificate-android/qa-output/eic-regression.txt
          grep -E "^ *2 +Sockets" certificate-android/qa-output/eic-regression.txt
          grep -F "N/A" certificate-android/qa-output/eic-regression.txt
          pages="$(pdfinfo "$PDF" | awk '/^Pages:/{print $2}')"
          for p in $(seq 1 "$pages"); do
            size="$(pdfinfo -f "$p" -l "$p" "$PDF" | awk -v p="$p" '$1=="Page" && $2==p && $3=="size:" {print $4" "$6; exit}')"
            width="${size%% *}"
            height="${size##* }"
            awk -v w="$width" -v h="$height" 'BEGIN{if(!(w>h))exit 1}'
          done
          mkdir -p certificate-android/qa-output/renders
          pdftoppm -f 1 -l 6 -png -r 130 "$PDF" certificate-android/qa-output/renders/eic >/dev/null 2>&1

      - name: Upload EIC PDF regression proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sperin-Certificates-v1.8.0-PDF-QA
          path: certificate-android/qa-output/
          if-no-files-found: error
          retention-days: 30
