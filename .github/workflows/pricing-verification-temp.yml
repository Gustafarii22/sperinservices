name: Temporary Website Pricing Verification
on:
  push:
    branches:
      - fix/website-pricing-nov-2026
    paths:
      - .github/workflows/pricing-verification-temp.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Pricing regression tests
        run: node --test tests/pricing.test.mjs
      - name: Production build
        run: npm run build
