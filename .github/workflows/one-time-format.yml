name: One-time QA formatting repair

on:
  push:
    branches:
      - fix/qa-formatting-debt

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qa-formatting-debt
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format existing QA debt only
        run: |
          npx prettier --write             certificate-android/qa/certificate.e2e.mjs             src/components/Header.tsx             src/components/ui/badge.tsx             src/components/ui/button.tsx             src/components/ui/form.tsx             src/components/ui/navigation-menu.tsx             src/components/ui/sidebar.tsx             src/components/ui/toggle.tsx             src/lib/pricing.ts             src/routes/__root.tsx             src/routes/pricing.tsx
      - name: Commit formatting if changed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificate-android/qa/certificate.e2e.mjs src/components/Header.tsx src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/form.tsx src/components/ui/navigation-menu.tsx src/components/ui/sidebar.tsx src/components/ui/toggle.tsx src/lib/pricing.ts src/routes/__root.tsx src/routes/pricing.tsx
          git commit -m "Format existing QA debt"
          git push
