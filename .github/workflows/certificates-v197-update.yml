name: Verify data-safe 1.9.6 update
on:
  push:
    branches: [fix/certificates-v197-data-safe-ux]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start offline app
        run: python3 -m http.server 4173 -d public > /tmp/cert-server.log 2>&1 &
      - name: Scanner preservation tests
        run: node --test certificate-android/qa/scan-core.test.mjs certificate-android/qa/scan-row-isolation.test.mjs tests/certificates-v197-preservation.test.mjs tests/certificates-v197-fit.test.mjs
      - name: Existing certificate view and PDF regression
        run: node tests/certificates-v196-view.e2e.mjs
      - name: Mobile upgrade data and workflow regression
        run: node tests/certificates-v197-data-safe.e2e.mjs
      - name: Portable JSON backup and fresh-install import safety
        run: node tests/certificates-v197-transfer.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificates-v197-verification
          path: certificate-android/qa-output/
  signing-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect retained signing material metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_JKS: ${{ secrets.SPERIN_CERTIFICATES_V196_SIGNING_JKS_BASE64 }}
          ORIGINAL_JKS: ${{ secrets.SPERIN_CERTIFICATES_SIGNING_JKS_BASE64 }}
        run: |
          if [ -n "$PREVIEW_JKS" ]; then echo 'V196_SIGNING_SECRET_PRESENT'; else echo 'V196_SIGNING_SECRET_MISSING'; fi
          if [ -n "$ORIGINAL_JKS" ]; then echo 'STABLE_SIGNING_SECRET_PRESENT_NOT_ASSUMED_COMPATIBLE'; else echo 'STABLE_SIGNING_SECRET_MISSING'; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | {key,ref,last_accessed_at}'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | test("key|sign|1.9.6";"i")) | {name,expired,id}'

  safe-preview-apk:
    name: Build separate data-safe 1.9.7 preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle exact tested certificate app into Android assets
        run: |
          mkdir -p certificate-android/app/src/main/assets/certificates
          cp -a public/certificates/. certificate-android/app/src/main/assets/certificates/
      - name: Build separately installable preview without touching stable package
        run: |
          gradle -p certificate-android :app:assemblePreview --no-daemon --stacktrace
          mkdir -p certificate-android/dist
          cp certificate-android/app/build/outputs/apk/preview/app-preview.apk certificate-android/dist/Sperin-Certificates-1.9.7-SAFE-PREVIEW.apk
      - name: Verify preview identity, version and signature
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK=certificate-android/dist/Sperin-Certificates-1.9.7-SAFE-PREVIEW.apk
          python3 certificate-android/qa/inspect-apk.py "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee certificate-android/dist/package.txt
          grep -F "name='uk.co.sperinservices.certificates.stable.preview.team.v197'" certificate-android/dist/package.txt
          grep -F "versionCode='200'" certificate-android/dist/package.txt
          grep -F "versionName='1.9.7-dev'" certificate-android/dist/package.txt
          sha256sum "$APK" > certificate-android/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sperin-Certificates-1.9.7-SAFE-PREVIEW
          path: |
            certificate-android/dist/Sperin-Certificates-1.9.7-SAFE-PREVIEW.apk
            certificate-android/dist/package.txt
            certificate-android/dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
